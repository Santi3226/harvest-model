<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="Q(t) promedio en la siembra: la cola se vacía, no hay estado estable">
<rect width="760" height="440" fill="#fcfcfb"/>
<text x="24" y="30" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600" fill="#0b0b0b">Q(t) promedio en la siembra: la cola se vacía, no hay estado estable</text>
<text x="24" y="50" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px" fill="#52514e">Lotes que todavía no entraron en servicio, promedio de 100 réplicas. t = días desde la apertura de la labor (1/10).</text>
