<text x="24" y="50" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px" fill="#52514e">Lotes que todavía no entraron en servicio, promedio de 98 réplicas. t = días desde la apertura de la labor (madurez).</text>
